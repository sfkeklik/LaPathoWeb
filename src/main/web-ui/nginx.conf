events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Increase timeouts for large file uploads
    client_max_body_size 2048M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    server {
        listen 80;
        server_name _;  # Accept requests from any hostname
        root /usr/share/nginx/html;
        index index.html;

        # Handle Angular routing - redirect all requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy to backend - handle all /api requests including tiles
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Important for file uploads
            client_max_body_size 2048M;
            proxy_request_buffering off;
        }

        # Cache static assets (excluding api calls)
        location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
